version: "3.8"

services:
  proxy-pool:
    build: .
    container_name: proxy-pool
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./resources:/app/resources:ro
      - proxy-pool-data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

volumes:
  proxy-pool-data:

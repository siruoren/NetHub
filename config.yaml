server:
  host: "0.0.0.0"
  port: 8080
  debug: false

database:
  path: "data/proxy_pool.db"

check:
  timeout: 5.0
  max_concurrent: 50
  latency_threshold: 1500.0
  check_mode: "auto"  # 检测模式: "auto"(优先内核转发回退TCP) / "http"(仅内核转发) / "tcp"(仅TCP/TLS)
  socks_port: 1080    # 本地转发端口（ConnectivityMonitor使用）
  http_port: 1081     # 本地HTTP转发端口
  kernel_path: "xray" # 内核可执行文件路径
  check_retries: 2    # 单次检测失败后重试次数

scheduler:
  fetch_interval: 3600
  verify_interval: 1800
  max_fail_count: 3
